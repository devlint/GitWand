# Link the C runtime statically on Windows, so gitwand-desktop.exe runs on a
# machine without the Visual C++ Redistributable.
#
# tauri-build already tries to link vcruntime statically, but from rustc
# 1.99.0 on the exe imported VCRUNTIME140.dll / VCRUNTIME140_1.dll again:
# v3.11.2 to v3.12.3 died at launch with STATUS_DLL_NOT_FOUND (0xC0000135) on
# a clean Windows, which is what winget's validation VM is. `crt-static` makes
# rustc link the static CRT itself and the `cc` crate build the vendored C
# dependencies (libgit2, …) with /MT, whatever tauri-build does.
#
# The release workflow checks the built exe for these imports.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
