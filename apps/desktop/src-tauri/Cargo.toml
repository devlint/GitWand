[package]
name = "gitwand-desktop"
version = "3.9.0"
description = "GitWand Desktop — standalone merge conflict resolution"
authors = ["Laurent Guitton <lb.guitton@gmail.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "gitwand_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ─── Parity probe (P2.3) ─────────────────────────────────────
#
# Petit binaire de test qui expose les commandes Tauri critiques en CLI, pour
# le harness de tests de parité Rust↔Node (`apps/desktop/tests/parity/`).
#
# Déclaré comme `[[example]]` plutôt que `[[bin]]` : tauri-bundler découvre
# automatiquement toutes les entrées `[[bin]]` d'un package et tente de les
# bundler comme binaires externes — ce qui cassait la release v1.5.1 car
# `parity_probe` n'est pas compilé dans la configuration de release normale.
# Les examples ne sont pas touchés par tauri-bundler et ne sont pas construits
# par défaut, donc pas besoin d'un feature flag.
#
# Build : `cargo build --example parity-probe`
# Sortie : `target/debug/examples/parity-probe`
[[example]]
name = "parity-probe"
path = "examples/parity_probe.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ─── Features (P4.2 — Dev loop & CI build times) ─────────────
#
# `telemetry` gates `tauri-plugin-aptabase` (and its reqwest/tokio subtree)
# as an optional dependency. Default (no feature) = no telemetry compiled
# at all: faster `cargo check`/`cargo test`/dev `cargo build`. Real release
# builds MUST pass `--features telemetry` (see release.yml) — lib.rs has a
# `compile_error!` that fires on any non-debug build missing this feature,
# so forgetting it is a hard build failure, not a silent analytics loss.
[features]
default = []
telemetry = ["dep:tauri-plugin-aptabase"]

[dependencies]
# `devtools` feature opens the WebView inspector via Cmd+Option+I (macOS)
# or right-click → Inspect. Required for profiling / debugging the frontend
# in production builds. Safe to ship: tauri only enables the menu when the
# app is built in debug mode unless we explicitly enable it in release too.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"
# Used for data-parallel iteration in workspace_*_all (P3.2). Each repo's
# git/gh subprocess runs on its own rayon thread instead of in series.
rayon = "1"
# Per-repo read/write serialization of git subprocesses (git/repo_lock.rs).
# `arc_lock` gives owned `Arc`-based guards so a command can hold the lock
# across its blocking `.output()` with a single-line RAII guard. Already in
# the tree transitively via tauri, so the direct dep adds ~zero binary cost.
parking_lot = { version = "0.12", features = ["arc_lock"] }
portable-pty = "0.9"

# libgit2 bindings for in-process git operations (P3.3). Used in the
# workspace_*_all hot paths to read branch + ahead/behind + file statuses
# without spawning git subprocesses (5-15ms each on macOS). Vendored to
# remove the runtime dependency on system libgit2 — adds ~500 KB to the
# binary in exchange for build reproducibility across machines.
#
# Scoped use only: the user-facing `git_status` command remains CLI-based
# to preserve the existing parity tests (`tests/parity/git-status.test.mjs`)
# which compare Rust output to the Node dev-server (also CLI-based).
# Pinned to >= 0.20.4 for the security advisory fixed in that release.
# Don't loosen this below 0.20.4 without checking the GHSA again.
git2 = { version = "0.20.4", default-features = false, features = ["vendored-libgit2"] }

# OS keychain access for storing forge credentials (Bitbucket App Passwords,
# future multi-account tokens). Uses Keychain on macOS, libsecret on Linux,
# Windows Credential Manager on Windows.
keyring = "2"

# Anonymous launch telemetry via Aptabase (privacy-first analytics for
# desktop/Tauri apps). Replaced the previous Umami ping: Umami Cloud
# filters non-browser User-Agents and silently dropped every event
# (HTTP 200 + `{"beep":"boop"}` decoy, nothing recorded). Aptabase
# authenticates by App Key, so there is no UA/bot filtering. Only used in
# release builds (cfg(feature = "telemetry"), see [features] below and
# lib.rs's compile_error! guard). Pulls in reqwest + tokio transitively —
# see Task 5 measurement note in the migration plan. Optional: gating it
# behind the `telemetry` feature keeps it (and its reqwest/tokio subtree)
# out of `cargo check`/`cargo test`/plain `cargo build` in dev.
tauri-plugin-aptabase = { version = "1.0.0", optional = true }

# Anonymous install ID generation (v4 random UUID, stored on first launch).
uuid = { version = "1", features = ["v4"] }

# Secrets scanner (v3.5.0) — linear-time regex engine (no catastrophic
# backtracking), a security plus since it also compiles user-supplied
# patterns from `.gitwandrc`. Mirrored by a pure-RegExp TS engine in
# @gitwand/core; see commands/secrets.rs.
regex = "1"

# ─── Release profile (P2.4) ──────────────────────────────────
#
# Profile tuné pour la build de production (vs defaults Cargo conservateurs).
# Gains attendus : binaire plus petit, code plus rapide. Compile time +30s.
#
# Notes :
# - `lto = "fat"` : optim trans-crates, +10-15% perf, -20% taille binaire.
# - `codegen-units = 1` : opti maximale (vs 16 par défaut), +1-3% perf.
# - `strip = "symbols"` : retire les symbols du binaire final, -10 MB env.
# - `panic = "unwind"` (default) intentionnel : les command handlers Tauri
#   reposent sur l'unwinding pour récupérer d'un panic sans tuer le process.
#   Ne PAS passer à "abort" sans audit complet du code.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3

# ─── Release-debug profile (P2.4) ────────────────────────────
#
# Build en mode release avec symbols conservés, pour profiling local
# (Instruments macOS, perf Linux, samply, etc.) sans recompiler en debug.
# Build : `cargo build --profile release-debug`
[profile.release-debug]
inherits = "release"
debug = true
strip = false

# ─── CI profile (P2.1 — Dev loop & CI build times) ───────────
#
# Profile for builds we never ship: today, the `bundle-smoke` job in ci.yml
# (still needs a real, signed tauri-action bundle to catch bundler
# regressions, but doesn't need the fully-optimized artifact users
# download). A future phase (P2.3 of the dev-loop plan) may point the
# parity-probe bench build at this profile too — not done here. Deliberately
# lighter than `release`: thin LTO + 16 codegen units cut link time without
# changing observable behavior. NEVER use this profile for a distributed
# artifact — see apps/desktop/CLAUDE.md §Performance invariants, which only
# pins `[profile.release]` (lto = "fat", codegen-units = 1, strip =
# "symbols"); non-shipped profiles are free to be lighter.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false

# ─── Patch: tauri-plugin-aptabase tokio runtime panic ────────
#
# Upstream 1.0.0 reaches for raw `tokio::spawn` / `futures::executor::block_on`
# in `src/client.rs` instead of the `tauri::async_runtime` equivalents, which
# panics with "there is no reactor running, must be called from the context of a
# Tokio 1.x runtime" — see aptabase/tauri-plugin-aptabase#16 and #22. The fix is
# queued upstream in PR #30 (unmerged as of this writing). Rather than depend on
# a random third-party fork carrying that unreviewed PR, we cherry-picked the
# minimal fixes onto a fork under our own GitHub account
# (`devlint/tauri-plugin-aptabase`, branch `fix/tokio-runtime-panic`) with no
# other changes and no dependency bumps:
#   - `start_polling` → `tauri::async_runtime::spawn` (rev a868ab1) — panicked at
#     startup in release builds.
#   - `flush_blocking` → `tauri::async_runtime::block_on` (rev 364eb00) — the
#     remaining unpatched call site; it fires from the plugin's `RunEvent::Exit`
#     handler on the main thread, so the same panic hit *exit* whenever the
#     process quit before the 60s background flush had drained the queue (#135).
#   - `reqwest 0.12.12` (default-tls -> native-tls -> openssl-sys) ->
#     `reqwest 0.13` with `default-features = false` + `rustls-no-provider`
#     (rev a3ed128, branch `chore/reqwest-013-rustls`) — dev-loop/CI
#     build-times pass (P4.1). `tauri-plugin-updater` separately pulls
#     `reqwest 0.13.4` with the exact same `rustls-no-provider` feature +
#     its own `rustls` dep on the `ring` crypto provider; before this, every
#     build compiled two full reqwest stacks plus native-tls/openssl-sys
#     just for this plugin's HTTP client. The fork now depends on `rustls`
#     directly (features = ["ring"], pure Rust — the full `rustls` feature
#     was tried first but transitively pulls `aws-lc-rs`/`aws-lc-sys`, a new
#     C-compiled crypto backend, defeating the point) and defensively
#     installs the default crypto provider in `src/dispatcher.rs` if no
#     other plugin has installed one yet, exactly mirroring
#     tauri-plugin-updater's own defensive install. No other API changes
#     needed in `src/dispatcher.rs` / `src/config.rs` — verified with
#     `cargo build`/`cargo test` against the fork in isolation, and against
#     this monorepo's actual Cargo.lock (reqwest resolves to 0.13.4 here)
#     via a temporary local-path override, before pulling it in for real.
[profile.dev]
# Dev loop: `debug = "line-tables-only"` still gives backtraces/panics with file:line,
# but cuts the size of the .o files (and therefore link time) vs full debuginfo.
debug = "line-tables-only"

[profile.dev.package."*"]
# opt-level = 1 on DEPENDENCIES only (workspace members are unaffected — Cargo scopes
# `[profile.dev.package."*"]` to non-workspace crates). Dependencies are compiled once
# and then reused across edits; keeping them unoptimized (opt-level = 0, the profile.dev
# default) makes debug-mode git2/regex/rayon slow at runtime for no compile-time benefit
# once they're cached. First build after this change is a full cold rebuild (invalidates
# the existing target/debug) — a one-time, expected cost.

[patch.crates-io]
tauri-plugin-aptabase = { git = "https://github.com/devlint/tauri-plugin-aptabase", rev = "a3ed1282162b2f16a3b160ead7e1627ad7201564" }
